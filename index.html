<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Habit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page-wrapper">
    <div class="tracker-card">
      
      <!-- Natural Header -->
      <header class="tracker-header">
        <span class="date-pill" id="currentDate">Today</span>
        <h1 class="tracker-title">Daily Habit Tracker</h1>
        <p class="tracker-subtitle">Cultivate consistency through small, steady daily rituals.</p>
      </header>

      <!-- Progress Section -->
      <section class="progress-section" aria-label="Habit completion progress">
        <div class="progress-meta">
          <span class="progress-label">Today's Progress</span>
          <span class="progress-count" id="progressText">0 of 0 completed</span>
        </div>
        <div class="progress-track" role="progressbar" id="progressBarWrapper" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="progressBar" style="width: 0%;"></div>
        </div>
      </section>

      <!-- Habit Input Form -->
      <form id="habitForm" class="habit-form" onsubmit="return false;">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="habitInput" 
            placeholder="Write a new habit to practice..." 
            maxlength="70"
            autocomplete="off"
            spellcheck="false"
          >
        </div>
        <button type="submit" id="addBtn" class="btn btn-primary">Add Habit</button>
      </form>

      <!-- Filter Controls -->
      <div class="filter-bar">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="tab-btn active" data-filter="all" role="tab" aria-selected="true">All Habits</button>
          <button type="button" class="tab-btn" data-filter="pending" role="tab" aria-selected="false">To Do</button>
          <button type="button" class="tab-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>
        <span class="items-summary" id="itemsSummary">0 total</span>
      </div>

      <!-- Habit List -->
      <ul id="habitList" class="habit-list" aria-label="Habits list"></ul>

      <!-- Empty State -->
      <div class="empty-state" id="emptyMsg">
        <div class="empty-icon-box" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </div>
        <p class="empty-title" id="emptyTitle">No habits listed yet</p>
        <p class="empty-description" id="emptyDesc">Add your first habit above to begin tracking your routine for today.</p>
      </div>

      <!-- Card Footer Stats -->
      <footer class="tracker-footer">
        <div class="stat-item">
          <span class="stat-number" id="statCompleted">0</span>
          <span class="stat-label">Done</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number" id="statPending">0</span>
          <span class="stat-label">Remaining</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number" id="statRate">0%</span>
          <span class="stat-label">Completion</span>
        </div>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
